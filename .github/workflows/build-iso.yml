name: Build CarsonOS Debian ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carsonos-debian-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            isolinux syslinux-common

      - name: Fix live-build Debian Contents index paths
        run: |
          # Ubuntu's packaged live-build expects Contents-amd64.gz directly
          # under dists/testing/, but Debian publishes it under dists/testing/main/.
          sudo sed -i \
            -e 's|/dists/${LB_PARENT_DISTRIBUTION}/Contents-|/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-|g' \
            -e 's|/dists/${LB_DISTRIBUTION}/Contents-|/dists/${LB_DISTRIBUTION}/main/Contents-|g' \
            /usr/lib/live/build/lb_chroot_linux-image
          grep -F '/main/Contents-' /usr/lib/live/build/lb_chroot_linux-image

      - name: Build CarsonOS Debian
        run: sudo sh ./scripts/build-iso.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CarsonOS-Debian-amd64
          path: |
            build/CarsonOS-Debian-amd64.iso
            build/CarsonOS-Debian-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
