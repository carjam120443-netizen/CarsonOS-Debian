name: Build CarsonOS Debian ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carsonos-debian-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            isolinux syslinux-common cpio

      - name: Fix live-build Debian Contents index paths
        run: |
          # Ubuntu's packaged live-build expects Contents-amd64.gz directly
          # under dists/testing/, but Debian publishes it under dists/testing/main/.
          sudo sed -i \
            -e 's|/dists/${LB_PARENT_DISTRIBUTION}/Contents-|/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-|g' \
            -e 's|/dists/${LB_DISTRIBUTION}/Contents-|/dists/${LB_DISTRIBUTION}/main/Contents-|g' \
            /usr/lib/live/build/lb_chroot_linux-image
          grep -F '/main/Contents-' /usr/lib/live/build/lb_chroot_linux-image

      - name: Fix live-build ISOLINUX template files
        run: |
          # live-build copies this template into the chroot and dereferences its files there.
          # Use regular files, not absolute symlinks that only resolve on the GitHub runner.
          BOOTLOADER_DIR=/usr/share/live/build/bootloaders/isolinux
          sudo test -f /usr/lib/ISOLINUX/isolinux.bin
          sudo test -f /usr/lib/syslinux/modules/bios/vesamenu.c32

          sudo install -m 0644 /usr/lib/ISOLINUX/isolinux.bin "$BOOTLOADER_DIR/isolinux.bin"

          for module in hdt.c32 ldlinux.c32 libcom32.c32 libgpl.c32 libmenu.c32 libutil.c32 vesamenu.c32; do
            sudo test -f "/usr/lib/syslinux/modules/bios/$module"
            sudo install -m 0644 "/usr/lib/syslinux/modules/bios/$module" "$BOOTLOADER_DIR/$module"
          done

          test -f "$BOOTLOADER_DIR/isolinux.bin"
          test -f "$BOOTLOADER_DIR/vesamenu.c32"
          test ! -L "$BOOTLOADER_DIR/isolinux.bin"
          test ! -L "$BOOTLOADER_DIR/vesamenu.c32"
          ls -l "$BOOTLOADER_DIR/isolinux.bin" "$BOOTLOADER_DIR/vesamenu.c32"

          # Ubuntu live-build's ISOLINUX stage unconditionally extracts a
          # bootlogo cpio archive, but only creates it itself in Ubuntu mode.
          # CarsonOS uses Debian mode, so provide a valid empty newc archive.
          sudo sh -c 'cd "$1" && printf "" | cpio -o -H newc > bootlogo' sh "$BOOTLOADER_DIR"
          sudo test -s "$BOOTLOADER_DIR/bootlogo"
          ls -l "$BOOTLOADER_DIR/bootlogo"

      - name: Fix live-build legacy rsvg command
        run: |
          # Ubuntu's live-build still calls the removed "rsvg" executable and uses
          # its old positional-output syntax. Debian Testing provides rsvg-convert.
          LIVE_BUILD_SCRIPT=/usr/lib/live/build/lb_binary_syslinux
          sudo grep -n 'rsvg' "$LIVE_BUILD_SCRIPT"
          sudo sed -i \
            -e 's|chroot/usr/bin/rsvg librsvg2-bin|chroot/usr/bin/rsvg-convert librsvg2-bin|g' \
            -e 's|rsvg --format png --height 480 --width 640 splash.svg splash.png|rsvg-convert --format png --height 480 --width 640 splash.svg -o splash.png|g' \
            -e 's|rsvg --format png --height 480 --width 640 "${_TARGET}/splash.svg" "${_TARGET}/splash.png"|rsvg-convert --format png --height 480 --width 640 "${_TARGET}/splash.svg" -o "${_TARGET}/splash.png"|g' \
            "$LIVE_BUILD_SCRIPT"
          sudo grep -n 'rsvg' "$LIVE_BUILD_SCRIPT"
          sudo grep -q 'rsvg-convert --format png --height 480 --width 640 splash.svg -o splash.png' "$LIVE_BUILD_SCRIPT"

      - name: Build CarsonOS Debian
        run: sudo sh ./scripts/build-iso.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CarsonOS-Debian-amd64
          path: |
            build/CarsonOS-Debian-amd64.iso
            build/CarsonOS-Debian-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
